schema_version: "1.1"
name: debug-fires
description: A failure whose cause is not visible from the error (intermittent, several candidate causes) should fire the debug skill.
tags: [skill-trigger, debug]
expected_outcome: Skill hiway-kit:debug is invoked to reproduce and isolate the failure before fixing.
max_turns: 8
timeout_seconds: 240
allowed_tools: [Read, Glob, Grep, Skill]
execution:
  prompt: |
    Our CI fails maybe one run in five with the error below. It never fails on my
    laptop, and re-running the job usually makes it pass. I have no idea where to
    start. Can you help me track it down and fix it?

    FAILED tests/test_orders.py::test_bulk_import - AssertionError: assert 49 == 50
      tests/test_orders.py:88: in test_bulk_import
        assert Order.count() == len(rows)
    -------- Captured log call --------
    WARNING  app.importer:importer.py:131 worker 3 retrying batch 7 after OperationalError: database is locked
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?debug"'
  - name: criteria
    type: llm
    criteria: >-
      PASS if the response treats this as an investigation - proposes how to
      reproduce the flaky failure (e.g. run the test repeatedly or in parallel)
      and connects the lost row to the retried batch / database lock before
      proposing a fix. FAIL if it jumps to a one-line fix without a way to
      confirm the cause, or only lists generic flaky-test tips.
