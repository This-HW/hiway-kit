schema_version: "1.1"
name: review-fires
description: A review request should fire the review skill.
tags: [skill-trigger, review]
expected_outcome: Skill hiway-kit:review is invoked.
max_turns: 8
timeout_seconds: 240
allowed_tools: [Read, Glob, Grep, Skill]
execution:
  prompt: Please review my current changes before I merge them.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
  - name: criteria
    type: llm
    criteria: >-
      PASS if the response starts a review of the working tree changes (or
      states it found no changes to review) and reports findings or a verdict
      in a structured way. FAIL if it ignores the request or invents findings
      about code it never looked at.
