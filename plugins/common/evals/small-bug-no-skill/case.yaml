schema_version: "1.1"
name: small-bug-no-skill
description: Negative case - a one-line Small fix must not fire any workflow skill.
tags: [skill-trigger, negative]
expected_outcome: No Skill call; the corrected line is given directly.
max_turns: 4
timeout_seconds: 240
allowed_tools: [Read, Glob, Grep, Skill]
execution:
  prompt: >-
    In utils.py my clamp function is `return min(x, hi)` but it should also
    enforce the lower bound `lo`. What is the one-line fix?
graders:
  - name: no-skill
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: answer
    type: regex
    pattern: 'max\(\s*lo\s*,\s*min\(\s*x\s*,\s*hi\s*\)\s*\)|min\(\s*max\(\s*x\s*,\s*lo\s*\)\s*,\s*hi\s*\)'
    target: last_message
    arm: both
